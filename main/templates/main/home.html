{% extends 'main/layouts/layout.html' %}
{% block content %}
<section>
    <div class="banner-wrapper bg-light">
      <div class="container py-5">
        <div class="row py-5">
          <div class="col-lg-8 col-md-10 m-auto text-center">

            <h1 class="banner-heading h1 text-secondary display-3 mb-4 light-300">
              Witaj w AI Dictionary
            </h1>
            <p class="banner-body text-muted py-3 fs-4">
              Wprowadź słowo po angielsku, aby wyszukać tłumaczenie.
            </p>

            <div class="position-relative" style="max-width: 800px; margin: 0 auto;">

                <form id="searchForm" class="d-flex justify-content-center" role="search">
                    <div class="input-group input-group-lg">
                        <input type="search" id="searchInput" class="form-control" style="box-shadow: none !important;" name="query" placeholder="Szukaj..." autocomplete="off">
                        <button class="btn btn-primary px-4"  style="box-shadow: none !important;" type="submit" id="searchButton">Szukaj</button>
                    </div>
                </form>
                <div id="resultsList" class="text-start"></div>
            </div>

          </div>
        </div>
      </div>
    </div>
</section>
{% endblock %}
